services:
  database:
    build: ./services/database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      FLAG_DATABASE: ${FLAG_DATABASE}
      PIVOT_SSH_PASSWORD: ${PIVOT_SSH_PASSWORD}
    # Publicado a propósito: el participante debe poder conectarse directamente a MariaDB una vez
    # filtra las credenciales en el Reto 1 (ver docs/context.md, "Arquitectura general").
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      sabana-lab:
        ipv4_address: 172.28.0.10

  webapp:
    build: ./services/webapp
    environment:
      DB_HOST: database
      DB_NAME: ${MYSQL_DATABASE}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      BOT_SECRET: ${BOT_SECRET}
      FLAG_WEBAPP_XSS: ${FLAG_WEBAPP_XSS}
      FLAG_WEBAPP_LFI: ${FLAG_WEBAPP_LFI}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      sabana-lab:
        ipv4_address: 172.28.0.20

  linux-server:
    build: ./services/linux-server
    environment:
      PIVOT_SSH_PASSWORD: ${PIVOT_SSH_PASSWORD}
      FLAG_LINUXSERVER_ROOT: ${FLAG_LINUXSERVER_ROOT}
      FLAG_LINUXSERVER_PROC: ${FLAG_LINUXSERVER_PROC}
    # Puerto SSH expuesto para que el participante se conecte con la credencial crackeada en el Reto 2.
    ports:
      - "2222:22"
    networks:
      sabana-lab:
        ipv4_address: 172.28.0.30

  xss-bot:
    build: ./services/xss-bot
    environment:
      WEBAPP_BASE_URL: ${WEBAPP_BASE_URL:-http://webapp:80}
      BOT_SECRET: ${BOT_SECRET}
      BOT_VISIT_INTERVAL_SECONDS: ${BOT_VISIT_INTERVAL_SECONDS:-30}
    depends_on:
      webapp:
        condition: service_started
    networks:
      sabana-lab:
        ipv4_address: 172.28.0.40

networks:
  sabana-lab:
    driver: bridge
    # IP fija por contenedor sobre bridge personalizada: cada servicio tiene una IP estable en la subred
    # del laboratorio (database .10, webapp .20, linux-server .30, xss-bot .40). El DNS interno de Docker
    # sigue resolviendo por nombre de servicio, así que las referencias por nombre (DB_HOST=database,
    # WEBAPP_BASE_URL=http://webapp:80) siguen funcionando; las IPs son un extra para escenarios donde el
    # participante trata cada servicio como un host distinto.
    #
    # La topología final del evento usará macvlan para dar a cada contenedor una IP propia en la red física
    # del edificio (ver docs/context.md, decisión de diseño #11, pendiente de docs/infra.jpg). macvlan
    # requiere una interfaz `parent` del host y config específica de la máquina, por eso no se usa en
    # desarrollo local — esta bridge con IPs fijas es el paso intermedio reproducible.
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
